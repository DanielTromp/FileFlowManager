[tool.poetry]
name = "fileflow"
version = "0.1.0"
description = "Intelligent automated file organization system for macOS"
authors = ["FileFlow Team <contact@fileflow.dev>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/fileflow/fileflow-manager"
repository = "https://github.com/fileflow/fileflow-manager"
documentation = "https://github.com/fileflow/fileflow-manager#readme"
keywords = ["file-management", "automation", "macos", "organization", "screenshots"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
packages = [
    { include = "fileflow_core" },
    { include = "fileflow_config" },
    { include = "fileflow_storage" },
    { include = "fileflow_cli" },
    { include = "fileflow_api" },
]
include = [
    "README.md",
    "LICENSE",
    "fileflow_config/defaults.py",
]
exclude = [
    "tests",
    "*.pyc",
    "__pycache__",
    "*.db",
]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.20.0"
pydantic = "^2.0"
tomli = {version = "^2.0", python = "<3.11"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
ruff = "^0.0.286"
mypy = "^1.5.0"

[tool.poetry.scripts]
fileflow = "fileflow_cli.__main__:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.per-file-ignores]
"fileflow_cli/*.py" = ["B904"]  # User-facing CLI intentionally simplifies exceptions
"fileflow_api/*.py" = ["B904"]  # User-facing API intentionally simplifies exceptions

[tool.mypy]
python_version = "3.10"
warn_return_any = false  # Relaxed for now
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed - many functions need annotations
disallow_incomplete_defs = false  # Relaxed for now
check_untyped_defs = true
no_implicit_optional = false  # Relaxed - Optional[...] = None is common
warn_redundant_casts = true
warn_unused_ignores = false  # Relaxed to avoid noise
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tomllib"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=fileflow_core --cov=fileflow_config --cov=fileflow_storage --cov=fileflow_cli --cov=fileflow_api"
