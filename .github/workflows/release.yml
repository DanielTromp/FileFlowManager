name: Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v1.2.3, etc.

permissions:
  contents: write # Needed to create releases and upload assets

jobs:
  build-and-release:
    name: Build and Release DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python for backend build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.6.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      # Build backend executable
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          poetry install --no-interaction
          poetry run pip install pyinstaller

      - name: Build backend executable
        working-directory: ./backend
        run: |
          poetry run pyinstaller \
            --name=fileflow-backend \
            --onefile \
            --clean \
            --noconfirm \
            --log-level=INFO \
            --hidden-import=fileflow_core \
            --hidden-import=fileflow_api \
            --hidden-import=fileflow_config \
            --hidden-import=fileflow_storage \
            --hidden-import=fileflow_cli \
            main.py

      - name: Verify backend executable
        run: |
          ls -lh backend/dist/
          file backend/dist/fileflow-backend
          echo "Backend executable size:"
          du -h backend/dist/fileflow-backend

      # Setup Node.js and pnpm for frontend
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      # Build and release using Tauri Action
      - name: Build Tauri app and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'FileFlow Manager ${{ github.ref_name }}'
          releaseBody: |
            # FileFlow Manager ${{ github.ref_name }}

            ## What's New
            See the full changelog for details on what's included in this release.

            ## Installation
            1. Download the DMG file below
            2. Open the DMG and drag FileFlow Manager to your Applications folder
            3. **Bypass macOS Gatekeeper** (required for unsigned apps):

               **Option 1: Right-click method (easiest)**
               - Locate FileFlow Manager in your Applications folder
               - Right-click (or Control-click) on the app
               - Select "Open" from the menu
               - Click "Open" in the security dialog
               - The app will now run (you only need to do this once)

               **Option 2: Command line method**
               ```bash
               xattr -d com.apple.quarantine "/Applications/FileFlow Manager.app"
               ```

               **Option 3: System Settings method**
               - Try to open the app normally (it will be blocked)
               - Go to System Settings > Privacy & Security
               - Scroll down to find the blocked app message
               - Click "Open Anyway"

            **Note:** This app is currently unsigned. We plan to add code signing in a future release.

            ## Requirements
            - macOS 10.15 (Catalina) or later

            ---

            📦 **Download the DMG below** to get started!
          releaseDraft: false
          prerelease: false
